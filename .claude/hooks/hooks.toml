# Settings of GDStudio's Claude Code hook dispatcher (docs/hooks.md). dispatch.py reads this file on every call; a
# game repository may add `.claude/hooks.local.toml` beside its launcher, whose keys replace these. Standard library
# only (the hooks run under `uv run --no-project`), so TOML, not YAML.

[agents]
# Agent types that may be started. `general-purpose` (also what an Agent call with no type starts) has no
# instructions or enforced rules of its own, so it is refused: use a project agent or a read-only helper.
refused = ["general-purpose"]
helpers = ["Explore", "Plan", "fork", "claude-code-guide", "web-fetch", "statusline-setup"]

[git]
# Branches that take no commits and no pushes from a session: work happens on a branch, merged by pull request.
protected_branches = ["main", "master"]

[protect]
# Files no Edit or Write may change (glob patterns, matched against the path with forward slashes).
paths = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/id_rsa*", "**/id_ed25519*",
  "**/gdstudio.local.toml", "**/.gdstudio-workspace",
  "**/.git/**", "**/.godot/**", "**/*.import",
  "**/tools/godot-*/**", "**/tools/blender-*/**",
]
# Files another program writes: edit their source instead (the hint names it).
generated = [
  ".github/pull_request_template.md",
  ".github/ISSUE_TEMPLATE/*.yml",
]
generated_hint = "it is generated from .github/conventions.yml: edit that file, then run `uv run --with pyyaml python .github/scripts/groundwork.py render`"
# Shell commands that would print a secret into the transcript (an environment variable named like one).
secret_names = '(?i)\$\{?(?:env:)?[A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD)[A-Z0-9_]*\}?'

[tools]
# Godot and Blender run only from the workspace's pinned copies (tools.toml): never Steam's or one on PATH.
names = ["godot", "blender"]
# A Godot started straight from a shell opens a window that takes the keyboard focus; only these flags mean it does
# not (otherwise `gds godot` runs it on a private desktop, docs/godot/no-focus.md).
windowless_flags = ["--headless", "--version", "--help", "-h"]

[proof]
# The Stop gate (docs/hooks.md#proof): a session that changed visual files in a game repository ends only once a
# capture (an image or a clip) newer than its last change sits in <workspace>/scratch/<repo>/<branch>/.
visual = ["game/**/*.tscn", "game/**/*.gdshader", "game/ui/**", "game/assets/**", "game/world/**"]
captures = ["*.png", "*.jpg", "*.gif", "*.mp4", "*.webm"]

[lessons]
# The learning loop (docs/hooks.md#learning): what the maintainer corrects becomes a row on the corrections page, and a
# lesson when the cause is general, in the same session. `{queue}`, `{corrections}` and `{lessons}` are filled in with
# absolute paths (the kit of the workspace); keep the texts short, the prompt one is added to every message.
# Pending rows wait in this folder (relative to the workspace); published ones move to its `published/` folder.
queue = "scratch/kit-lessons-queue"
# A queued file that says this is waiting for a cause or an issue: the Stop gate lets it be.
waiting = '''(?im)^\s*waiting on:\s*\S'''
prompt = """GDStudio learning loop: if this message corrects an agent or reports a problem in work agents did earlier, then besides fixing it, in this same session add a row to the kit's docs/research/maintainer-corrections.md (the maintainer's words, concept missed, detail missed, check for next time), plus a lesson in docs/lessons/ if the cause is general, in a kit pull request.
Cause not known yet: write the row to {queue}/<slug>.md with a `Waiting on: #N` line, and publish it when the cause is found (a session cannot end with a queued row that is not waiting)."""
session = """GDStudio learning loop: before you start, read the checks in {corrections} that touch your task and search {lessons} (the index) for what you are about to solve; they hold what the maintainer already had to point out. When the maintainer corrects you or reports a problem in earlier work, add the row and any lesson in this session."""
subagent = """GDStudio learning loop: before you start, read the checks in {corrections} that touch your task and search {lessons} for what you are about to solve. If your task came from a maintainer correction, put the row's text (the maintainer's words, concept missed, detail missed, check for next time) in your final report: the coordinator publishes it, so do not edit that table yourself. If you find a general cause on the way, say so in the report too."""
