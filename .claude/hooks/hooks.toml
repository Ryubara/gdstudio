# Settings of GDStudio's Claude Code hook dispatcher (docs/studio/hooks.md). dispatch.py reads this file on every call; a
# game repository may add `.claude/hooks.local.toml` beside its launcher, whose keys replace these. Standard library
# only (the hooks run under `uv run --no-project`), so TOML, not YAML.

[agents]
# Agent types that may be started. `general-purpose` (also what an Agent call with no type starts) has no
# instructions or enforced rules of its own, so it is refused: use a project agent or a read-only helper.
refused = ["general-purpose"]
helpers = ["Explore", "Plan", "fork", "claude-code-guide", "web-fetch", "statusline-setup"]

[git]
# Branches that take no commits and no pushes from a session: work happens on a branch, merged by pull request.
protected_branches = ["main", "master"]

[mains]
# Every main checkout in <workspace>/repos/ follows origin (docs/studio/hooks.md#mains): `git pull --ff-only` right after a
# command that merges a pull request, at session start, and at Stop at most once every `every_seconds` (auto-merges land
# without a command). A checkout with local changes in the way is never touched, only named.
pull = true
every_seconds = 120
stamp = "cache/mains-pulled"

[sweep]
# Finished worktrees are removed in the background (docs/studio/hooks.md#sweep, docs/studio/workspace.md#sweep): `gds worktree sweep`
# starts at session start, right after a command that merges a pull request, and at Stop at most once every
# `every_seconds`. It never blocks the hook; its report is appended to `log` (relative to the workspace), which is
# moved aside to `*.old.log` past `max_log_bytes`. `args` are extra flags for the sweep (for example "--no-idle").
enabled = true
every_seconds = 600
stamp = "cache/worktree-sweep-started"
log = "scratch/worktree-sweep.log"
max_log_bytes = 1000000
args = []

[disk]
# The disk guard (docs/studio/hooks.md#disk, docs/studio/workspace.md#disk). Every hook event (a tool call, an agent's start and stop, a
# session's start and stop) starts `gds disk guard` in the background at most once every `every_seconds`: under
# `soft_gb` free it runs the worktree sweep, clears the import caches of worktrees idle for `imports_idle_hours`, and
# deletes the downloads and captures of scratch topics past their issue or pull request; it writes `status`, which the mod shows in
# the status line. Under `hard_gb` free, a task agent's start, `gds issue start` and `git worktree add` are refused
# (helpers and the agents of `exempt` are not). Budgets name the worktrees and scratch topics that are too big.
enabled = true
soft_gb = 40
hard_gb = 10
every_seconds = 300
stamp = "cache/disk-guard-started"
log = "scratch/disk-guard.log"
max_log_bytes = 1000000
status = "cache/disk-guard.json"
worktree_budget_gb = 4
scratch_budget_gb = 2
imports_idle_hours = 2
scratch_grace_hours = 12
exempt = ["reviewer"]

[protect]
# Files no Edit or Write may change (glob patterns, matched against the path with forward slashes).
paths = [
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/id_rsa*", "**/id_ed25519*",
  "**/gdstudio.local.toml", "**/.gdstudio-workspace",
  "**/.git/**", "**/.godot/**", "**/*.import",
  "**/tools/godot-*/**", "**/tools/blender-*/**",
]
# Files another program writes: edit their source instead (the hint names it).
generated = [
  ".github/pull_request_template.md",
  ".github/ISSUE_TEMPLATE/*.yml",
]
generated_hint = "it is generated from .github/conventions.yml: edit that file, then run `uv run --with pyyaml python .github/scripts/groundwork.py render`"
# Shell commands that would print a secret into the transcript (an environment variable named like one).
secret_names = '(?i)\$\{?(?:env:)?[A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD)[A-Z0-9_]*\}?'

[tools]
# Godot and Blender run only from the workspace's pinned copies (tools.toml): never Steam's or one on PATH.
names = ["godot", "blender"]
# A Godot started straight from a shell opens a window that takes the keyboard focus; only these flags mean it does
# not (otherwise `gds godot` runs it on a private desktop, docs/engines/godot/no-focus.md).
windowless_flags = ["--headless", "--version", "--help", "-h"]
# A local browser probe (headless Chrome under pointer lock) clips the person's real cursor to its hidden window, so it
# runs through `gds quiet` too: scripts on these paths, and any Python or Node run whose command names a marker.
browser_probes = ["**/web_smoke/*.py"]
browser_markers = ["playwright", "puppeteer"]

[proof]
# The Stop gate (docs/studio/hooks.md#proof): a session that changed visual files in a game repository ends only once a
# capture (an image or a clip) newer than its last change sits in <workspace>/scratch/<repo>/<branch>/.
visual = ["game/**/*.tscn", "game/**/*.gdshader", "game/ui/**", "game/assets/**", "game/world/**"]
captures = ["*.png", "*.jpg", "*.gif", "*.mp4", "*.webm"]

[lessons]
# The learning loop (docs/studio/hooks.md#learning): a mistake, an agent's own or one the maintainer corrects, updates
# the topic section an agent reads for that task (docs/studio/rules.md), in the same session; there are no lesson pages.
# A maintainer correction also gets a line on the corrections log. `{queue}`, `{corrections}`, `{rules}` and `{lessons}` are filled in with absolute paths
# (the kit of the workspace); keep the texts short, the prompt one is added to every message.
# Pending corrections wait in this folder (relative to the workspace); published ones move to its `published/` folder.
queue = "scratch/kit-lessons-queue"
# A queued file that says this is waiting for a cause or an issue: the Stop gate lets it be.
waiting = '''(?im)^\s*waiting on:\s*\S'''
prompt = """GDStudio learning loop: if this message corrects an agent or reports a problem in earlier work, then besides fixing it, in this session update the topic section it belongs to (`gds learn <words>` finds it; format in {rules}; never a lesson page) and a line on {corrections} (what was pointed out, in our words, with its issue or pull request and date, never quoted), in a kit pull request.
Cause not known yet: queue it in {queue}/<slug>.md with a `Waiting on: #N` line."""
session = """GDStudio learning loop: before you start, run `gds learn <words of your task>` and read the sections it prints; they hold the mistakes already made. A mistake, yours or one the maintainer corrects, updates its topic section in this session ({rules}), never a lesson page; a correction also gets a line on {corrections}."""
subagent = """GDStudio learning loop: before you start, read every section your prompt's `Read:` lines name (`page.md#anchor`, a page under the kit's docs/ folder) and run `gds learn <words of your task>` for more. Your final report has a `Read:` line naming the sections you read and a `Docs gaps:` line naming each one you found missing, wrong or out of date for this task (`Docs gaps: none` when there were none). A mistake you make or find updates the topic section it belongs to ({rules}: the approach, what to watch out for, where it was seen), in a kit branch, named in your report's Mistakes section as `page.md#anchor`; never a lesson page. If your task came from a maintainer correction, also put the log line (what the maintainer pointed out, in our words with its source and never quoted, and the section of its rule) in your final report: the coordinator adds it to {corrections}, so do not edit that page yourself."""

[issues]
# Issue order (docs/studio/hooks.md#issues, docs/studio/starting-work.md): issues start oldest first, through `gds issue start`. Only the
# `window` oldest open issues that are not S-in-progress, S-pending-review, S-blocked or S-needs-info (and that no open
# pull request closes) may start, P-critical ones first. A game replaces `window` in `.claude/hooks.local.toml`.
window = 5
# The record of started issues, relative to the workspace: `gds issue start` writes it, the Agent guard reads it.
ledger = "cache/issues-started.json"
# A task agent's prompt must name a started issue (`Issue: owner/repo#N`) or an open pull request it continues
# (`PR: owner/repo#N`). Agent types that take no task are exempt: the `[agents] helpers` and these.
enforce = true
exempt = ["reviewer"]

[attach]
# `gh pr create|edit --attach` (docs/studio/capture.md#attaching) is refused unless the body it sends already refers to every
# attached file inside this section, the before capture between the `Before:` and `After:` lines, by a path that names
# the same file as the `--attach` path (`gh` compares files, a relative path from the folder it runs in): otherwise the
# images land at the end of the body, after `## AI use`, and the references stay local (docs/studio/hooks.md#attach-paths).
enforce = true
section = "Screenshots"
# After a command that opened or edited a pull request (or printed its address), the description is read back and a
# local image reference that was never swapped for an upload is named at once: the second line of defence, for a pull
# request opened by a path the guard before the command could not read (a script, an alias).
readback = true

[pr_body]
# `gh pr create|edit` with a body (`--body-file`, or a literal `--body`) that `groundwork.py check-body` refuses is
# refused before it runs (docs/studio/hooks.md#pr-body): the same function `pr-rules` runs, in the checkout of the repository
# the pull request is for. `gds pr check-body <file> [--title <file>]` runs it by hand.
enforce = true

[brief]
# The sections a task agent reads first (docs/studio/starting-work.md#starting-an-agent, docs/studio/hooks.md#docs): the
# coordinator runs `gds brief <owner/repo>#N` before every Agent call and puts the `Read: <page>.md#<anchor>` lines it
# prints in the prompt. With `enforce`, the Agent guard refuses a task agent (any but the `[agents] helpers` and the
# `[issues] exempt`) whose prompt has no `Read:` line naming a section, or names one the kit's docs do not have. With
# `report`, SubagentStop holds back once a task agent's final report that names no section it read (`Read:`) or has no
# `Docs gaps:` line.
enforce = true
report = true

[docs]
# Docs ship with the change (docs/studio/hooks.md#docs).
# Stop and SubagentStop hold a session back once while a branch of a worktree here has commits ahead of origin/main and
# no open or merged pull request (relative to the workspace).
kit_worktrees = "worktrees/gdstudio"

[stop_check]
# The agent-stall gate (docs/studio/hooks.md#stall): a task agent that ends its turn without a report is finished for good, because
# nothing wakes a background agent. SubagentStop refuses such an end for these agent types (the reviewer and the helpers
# are not listed, so they are never touched) up to `max_refusals` times per agent, then lets it go: the gate can never
# hold an agent forever. A final message is a report when it matches `report` (a pull request link or number, a
# `Mistakes` line, or a blocker line), and an agent with a background task still running is waiting, not stalled.
agents = ["godot-engineer", "backend-engineer", "blender-artist", "level-designer"]
max_refusals = 2
# Where the refusals are counted, relative to the workspace.
counter = "cache/stop-check.json"
report = '''(?im)(github\.com/[\w.-]+/[\w.-]+/pull/\d+|\b(?:PR|pull request)\s*#\d+|^[\s>*_#-]*mistakes?\b|^[\s>*_#-]*(?:blocked|blocker)\b[\s*_]*[:–—-]|\bstopped because\b|\b(?:i am|i'm|is) blocked\b)'''

[idle]
# The coordinator check (docs/studio/hooks.md#idle): the main session's Stop is refused while an issue of any repository in
# workspace.toml may start now (the window's "May start now", plus blocked issues whose blocker closed) and has no agent. The
# way out is `gds issue start`, or `gds issue block <ref> --on <#N|maintainer> --why "..."`. Task agents never send Stop.
# GitHub is asked at most once per `cache_seconds` and for at most `budget_seconds` in all; any failure lets the stop through.
enforce = true
cache_seconds = 60
budget_seconds = 40
# Refusals in a row before the end is allowed (the count resets when nothing is idle, and lapses after an hour).
max_refusals = 2
# Where the refusals are counted, relative to the workspace.
counter = "cache/idle-check-refusals.json"
