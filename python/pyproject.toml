[project]
name = "gds-tools"
version = "0.1.0"
description = "GDStudio's shared tooling: workspace bootstrap, pinned tools, checks and pipelines for agents."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gds = "gds_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gds_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
