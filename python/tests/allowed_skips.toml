# The tests that may skip in CI, each with the platforms it may skip on and why (kit #797). CI runs pytest with
# `--allowed-skips python/tests/allowed_skips.toml` (python/tests/skip_allowlist.py): a skip that is not here fails the
# run, and so does an entry whose test ran on a platform it names. A new skip in CI is an entry with its reason here,
# in the same pull request. Platforms are `sys.platform` values: win32, linux, darwin.
#
# Every entry is a platform fact: the test proves something that exists on one system only, and runs on that system's
# runner. A tool a test needs is installed on the runner instead (the pinned Godot on windows-2025).

[[skip]]
test = "test_hold.py::test_the_step_itself"
platforms = ["win32"]
reason = "the hold step runs under Linux bash on an ubuntu runner; it runs on the Linux and macOS jobs"

