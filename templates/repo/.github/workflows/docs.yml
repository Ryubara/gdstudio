# The documentation site, published from the default branch: a push to it builds the site strictly (a broken link or a
# page missing from the nav fails) and publishes it to GitHub Pages (Pages' source is "GitHub Actions"). The checks a
# pull request needs (`mkdocs`, `markdownlint`, `actionlint`) are jobs of ci.yml. Actions are pinned to a full commit
# SHA; the tag is in the comment beside it.
name: docs

on:
  push:
    branches: [main]

permissions:
  contents: read

# cancels-on-main: a push to the default branch cancels the docs run of the commit before it. That is fine here: the
# site is rebuilt in full from the newest commit, so a cancelled build or deploy is replaced by the next one, and the
# pages never go back to an older commit. (Unlike `ci`, whose run on each commit is its own result.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdocs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mkdocs build --strict
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Only this job may write to Pages, and only from the default branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mkdocs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
