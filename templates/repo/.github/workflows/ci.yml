# The game's build and tests, with the same pinned Godot agents use: the runner's work folder becomes a GDStudio
# workspace, the kit's `gds workspace init` fetches Godot and GdUnit4 from tools.toml (hash-checked, cached), and the
# project is imported and run headless. Any engine or script error fails the job, since Godot itself exits 0 on most
# of them. The `web` job exports the game for the browser, checks that the tests and tools stayed out of it and boots
# the export in a headless browser.
# `build-ok` is the required check for the build, so the jobs above it can change freely.
# Actions are pinned to a full commit SHA; the tag is in the comment beside it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The tool that runs the hooks. What it runs (gdtoolkit's version, the files, the settings) is `.pre-commit-config.yaml`.
  PRE_COMMIT: pre-commit@4.7.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    # The rules a program can check, in seconds: the conventions file is well formed and the generated files match it,
    # the files the kit owns are the kit's (`gds sync --check`), and the project follows the folder, naming and
    # dependency rules (`gds check layout`, the kit's docs/engines/godot/project-conventions.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/{GAME_SLUG}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: {KIT_REPO}
          path: repos/gdstudio
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The conventions file and the files generated from it
        working-directory: repos/{GAME_SLUG}
        run: |
          uv run --with pyyaml python .github/scripts/groundwork.py validate
          uv run --with pyyaml python .github/scripts/groundwork.py render --check
          uv run --with pyyaml python .github/scripts/groundwork.py check-files
      - name: The kit's files are the kit's
        run: uv run --project repos/gdstudio/python gds sync repos/{GAME_SLUG} --check
      - name: The folder, naming and dependency rules
        run: uv run --project repos/gdstudio/python gds check layout repos/{GAME_SLUG}/game

  godot:
    needs: conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/{GAME_SLUG}
          persist-credentials: false
          lfs: true # models, textures and sounds are LFS objects: without them Godot imports pointer files
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: {KIT_REPO}
          path: repos/gdstudio
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot and GdUnit4
        run: uv run --project repos/gdstudio/python gds workspace init --workspace . --no-clone --no-mcp --fetch godot,gdunit4
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/{GAME_SLUG}/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: Every script parses
        # The import and the run load only the scripts the main scene reaches; the editor and an export load them
        # all, so a script that names an autoload the project does not register fails only there (kit #814).
        run: uv run --project repos/gdstudio/python gds check scripts repos/{GAME_SLUG}/game
      - name: Run the main scene
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/{GAME_SLUG}/game --quit-after 60 2>&1 | tee run.log
          ! grep -E "^(SCRIPT )?ERROR" run.log
      - name: Run the tests (GdUnit4)
        # No `-d`: with the debugger attached, the first script error stops the engine at a prompt and the job hangs.
        # `--ignoreHeadlessMode` is needed because GdUnit4 otherwise refuses to run headless. The reports go outside
        # the project (`-rd ../../../reports`: Godot runs in the project folder, three levels below the work folder, and
        # GdUnit4 reads an absolute `/path` as `res://path`): generated files never live under res://. Godot prints a
        # leak after the run has finished, so only the log shows it.
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/{GAME_SLUG}/game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests -rd ../../../reports -c --ignoreHeadlessMode --fixed-fps 60 --verbose 2>&1 | tee tests.log
          ! grep -E "leaked at exit|still in use" tests.log
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdunit4-report
          path: |
            reports
            tests.log
          if-no-files-found: warn

  web:
    needs: conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/{GAME_SLUG}
          persist-credentials: false
          lfs: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: {KIT_REPO}
          path: repos/gdstudio
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-web-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot and its export templates
        # The templates are about 1 GB.
        run: uv run --project repos/gdstudio/python gds workspace init --workspace . --no-clone --no-mcp --fetch godot,godot-templates
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/{GAME_SLUG}/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: Export the web build
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          mkdir -p repos/{GAME_SLUG}/build/web
          "$godot" --headless --path repos/{GAME_SLUG}/game --export-release Web 2>&1 | tee export.log
          if grep -E "ERROR" export.log; then exit 1; fi
          test -s repos/{GAME_SLUG}/build/web/index.pck
          test -s repos/{GAME_SLUG}/build/web/index.wasm
      - name: The export holds the level and leaves the tests and tools out
        run: |
          pck=repos/{GAME_SLUG}/build/web/index.pck
          grep -aq "res://world/prototype/prototype_level.tscn" "$pck"
          if grep -aq -e "res://tests/" -e "res://tools/" "$pck"; then exit 1; fi
      - name: The browser for the boot check
        # Playwright's own headless Chromium, the one the local probes use (the kit's docs/engines/godot/web-probes.md#running).
        # The runner image already has the shared libraries Chromium needs; --with-deps adds fonts from the Ubuntu
        # mirror, which was unreachable for an hour on 2026-11-11 (#1224) and stalled apt for 39 minutes the same day
        # (#1235). Each call has its own limit (a normal install takes about 20 s): the apt one is tried once, then the
        # browser alone, twice. The step's limit stops anything those miss.
        timeout-minutes: 12
        run: |
          pw="uvx playwright@1.64.1"
          timeout -k 30 240 $pw install --with-deps chromium-headless-shell && exit 0
          echo "::warning::apt mirror unreachable or stalled; installing Chromium without its system packages"
          for try in 1 2; do
            timeout -k 30 180 $pw install chromium-headless-shell && exit 0
            echo "::warning::Chromium download $try failed or stalled"
          done
          exit 1
      - name: Boot the web export in a browser
        # The export served and opened with `?probe`: it fails on a console error, a page error, a failed request or
        # no first frames within 60 s, and writes the time to them and the pack's size to the job summary
        # (game/tools/web_smoke/boot_check.py, the kit's file in every game). `gds quiet` is how every browser
        # probe runs; off Windows it starts the program as it is.
        run: |
          uv run --project repos/gdstudio/python gds quiet -- \
            uv run --with playwright==1.64.1 python repos/{GAME_SLUG}/game/tools/web_smoke/boot_check.py \
            repos/{GAME_SLUG}/build/web repos/{GAME_SLUG}/build/boot --title "Web boot"
      - name: The game's own browser smoke (touch controls)
        # 3D Third Person drives its touch layer in a phone-sized page (`?probe&play`); a game without the script has
        # nothing more to add. Ratio 1 and no pictures: the runner's software renderer draws slowly.
        run: |
          smoke=repos/{GAME_SLUG}/game/tools/web_smoke/touch_smoke.py
          if [ ! -f "$smoke" ]; then echo "no $smoke: nothing to add"; exit 0; fi
          uv run --project repos/gdstudio/python gds quiet -- \
            uv run --with playwright==1.64.1 python "$smoke" repos/{GAME_SLUG}/build/web repos/{GAME_SLUG}/build/smoke --ratio 1 --no-shots
          echo "Touch smoke: every check passed" >> "$GITHUB_STEP_SUMMARY"
      - name: The game's web program list is current
        # 3D Third Person serves its recorded GL program list beside the page, which links it before the engine boots
        # (ShaderPrelink). A material, shader or light the list lacks is linked at its first draw, up to a second's wait
        # on a fresh GPU browser: the page plays on SwiftShader (which records the same programs as a GPU) and the step
        # fails when it links more than 10 the list lacks (kit docs/engines/godot/first-use-hitches.md#prelink-check).
        run: |
          list=repos/{GAME_SLUG}/game/assets/shaders/web/shader_programs.json
          probe=repos/{GAME_SLUG}/game/tools/web_smoke/shader_programs.py
          if [ ! -f "$list" ] || [ ! -f "$probe" ]; then echo "no program list: nothing to check"; exit 0; fi
          if [ ! -s repos/{GAME_SLUG}/build/web/shader_programs.json ]; then echo "the export served no list: turn the gds_game editor plugin on"; exit 1; fi
          grep -q "gdsPrelink.load(" repos/{GAME_SLUG}/build/web/index.html
          uv run --project repos/gdstudio/python gds quiet -- \
            uv run --with playwright==1.64.1 python "$probe" repos/{GAME_SLUG}/build/web repos/{GAME_SLUG}/build/programs \
            --list "$list" --max-missed 10 --quiet-s 20 --timeout-s 300
          echo "Program list: current" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the browser captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-smoke
          path: |
            repos/{GAME_SLUG}/build/boot
            repos/{GAME_SLUG}/build/smoke
            repos/{GAME_SLUG}/build/programs
          if-no-files-found: ignore
          retention-days: 7

  gdlint:
    # The commit hook itself, so its version (the `rev` in `.pre-commit-config.yaml`), its files and its settings cannot
    # differ from what a person's machine runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: gdformat and gdlint on every script
        # `pre-commit run` takes one hook id, so one call each (two in one call failed every new game: kit #779).
        run: |
          uvx "$PRE_COMMIT" run gdformat --all-files
          uvx "$PRE_COMMIT" run gdlint --all-files

  mkdocs:
    # The documentation site built strictly (a broken link or a page missing from the nav fails). The push to the
    # default branch builds and publishes the site in docs.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The rules are in .markdownlint.yaml; the files skipped in .markdownlint-cli2.yaml.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #.venv
            #site

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release binary, checked against a sha256 pinned here (from the release's actionlint_1.7.12_checksums.txt).
      # Never `go install`: actionlint 1.7.12 asks for Go 1.25, the runner's Go is older, and GOTOOLCHAIN=auto then
      # downloads a toolchain that sum.golang.org and go.dev answered 404 for (kit #962). GitHub's release host
      # answered 504 for minutes on 2026-11-08 (kit #823), so curl retries on any error.
      - name: Install actionlint 1.7.12
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - run: actionlint -color .github/workflows/*.yml

  build-ok:
    if: always()
    needs: [conventions, godot, web, gdlint, mkdocs, markdownlint, actionlint]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
