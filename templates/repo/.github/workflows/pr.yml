# Checks that only make sense on a pull request, all driven by .github/conventions.yml, run as the steps of the one
# `pr-rules` job. A pull request is squash-merged, so its title becomes the one commit on the default branch (the title
# step); its description must follow the template (the description step); a change to code must change the docs (the
# docs step); and its commits carry only the allowed trailers and no e-mail addresses (the commits step). The checker
# exits 0 (pass), 1 (refused) or 2 (conventions unusable). Actions are pinned to a full commit SHA; the tag is in the comment beside it.
#
# It runs on `pull_request_target`, not `pull_request`, so a pull request from a fork is checked the first time: GitHub
# holds a first-time contributor's `pull_request` workflows until a maintainer approves them. That is safe only because
# of four rules, which every job here keeps:
#   1. Every checkout is the base branch (no `ref`, no `repository`), so what runs is the repository's own checker,
#      never the pull request's code.
#   2. Nothing from the pull request is run or built. Title and description come from the event; the changed files and
#      the commits come from the API, never from a checkout of the branch.
#   3. Title and description are attacker-controlled: they reach the checker only through an environment variable and a
#      file written from it, never expanded into a script's text.
#   4. The token is read-only and no secret is used.
# The workflow that runs is the base branch's, so an edit to this file takes effect once it merges.
#
# The four checks are steps of one job: one runner and one required name instead of four (#447, the runners are the
# bottleneck; docs/research/ci-jobs.md).
name: pr

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# On `pull_request_target`, `github.ref` is the base branch, so the group names the pull request. An edit gets its own
# group, so it never cancels the run of a push that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' }}
  cancel-in-progress: true

jobs:
  # The four checks as one job. A step after a failed one still runs (`!cancelled()`), so one run lists every refusal;
  # the job fails when any step failed. Same four rules: the base branch's checkout, the API for files and commits,
  # title and description only through the environment, a read-only token. The changed files come from the API (at most
  # 3000; a bigger pull request is refused rather than half-checked).
  pr-rules:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: read   # the checks that failed on an earlier commit of the pull request (pr-history)
      issues: read   # the issues it closes and their labels (pr-history)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Write the title and description to files
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "unexpected pull request number" >&2; exit 1; }
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: Check the title against the commit conventions
        run: uv run --with pyyaml python .github/scripts/groundwork.py check-title "$RUNNER_TEMP/pr-title.txt"
      - name: Check the description against the template
        if: ${{ !cancelled() }}
        # The description is judged with what the API knows of the pull request (checks that failed on its earlier
        # commits, the issues it closes and their labels): `pr-history` reads it with the read-only token and falls back
        # to the title alone when GitHub cannot be asked (the lessons, kit docs and read-first rules).
        run: |
          set -euo pipefail
          uv run --with pyyaml python .github/scripts/groundwork.py pr-history --repo "$GH_REPO" --number "$NUMBER" \
            > "$RUNNER_TEMP/pr-history.json"
          uv run --with pyyaml python .github/scripts/groundwork.py check-body --body "$RUNNER_TEMP/pr-body.md" \
            --title "$RUNNER_TEMP/pr-title.txt" --history "$RUNNER_TEMP/pr-history.json"
      - name: Check that the docs change with the code
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/pulls/$NUMBER/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          if [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" -ge 3000 ]; then
            echo "the pull request changes 3000 files or more, which the API does not list in full: split it" >&2
            exit 1
          fi
          uv run --with pyyaml python .github/scripts/groundwork.py check-docs \
            --body "$RUNNER_TEMP/pr-body.md" --changed "$RUNNER_TEMP/changed.txt"
      - name: Check the commits' trailers
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$NUMBER/commits" > "$RUNNER_TEMP/commits.json"
          uv run --with pyyaml python .github/scripts/groundwork.py check-commits \
            --commits "$RUNNER_TEMP/commits.json" --body "$RUNNER_TEMP/pr-body.md"
