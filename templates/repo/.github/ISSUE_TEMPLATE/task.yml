# Generated from .github/conventions.yml by `groundwork.py render`; edit the conventions, not this file.
name: Task
description: A piece of work for a maintainer or an agent
title: 'Task: '
labels:
- task
- S-needs-triage
body:
- type: markdown
  attributes:
    value: 'A task is written so that someone with no other context can do it: start with the problem.

      '
- type: input
  id: from
  attributes:
