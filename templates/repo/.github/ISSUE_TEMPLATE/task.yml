- type: textarea
  id: summary
  attributes:
    label: Summary
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: The part of the project; the matching A- label is applied from it.
    options:
    - A-core
    - A-gameplay
    - A-ui
    - A-net
    - A-world
    - A-art
    - A-audio
    - A-build
    - A-ci
    - A-agents
    - A-docs
    - A-tests
  validations:
    required: true
- type: input
  id: design-page
  attributes:
    label: Design page
    description: The design or research page (and section) under docs/design or docs/research that covers this,
      as a link, or none yet.
