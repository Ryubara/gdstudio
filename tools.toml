[tools.godot.platforms.macos-x64]
url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"
sha512 = "38aa16e5bba2083941fc5b3e54be0089bd4cc35e32415f5b9fd9a8a6a7b9818255d44532ea8ef94b5aef56c4b407c2d634fa4f657e4ebe681ebbf59b7bac69ca"
exe = "Godot.app/Contents/MacOS/Godot"

[tools.godot-templates]
# Export templates (about 1 GB): needed to export builds, not to edit or test. Fetched with `--fetch godot-templates`
# or `--fetch all`, and installed into the pinned Godot's own editor_data/.
version = "4.7.2"
default = false
kind = "godot-templates"
requires = "godot"

[tools.godot-templates.platforms.any]
url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
