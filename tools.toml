exe = "Godot_v4.7.2-stable_linux.arm64"

[tools.godot.platforms.macos-arm64]
url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"
