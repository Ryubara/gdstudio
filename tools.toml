# Pinned third-party tools that agents and CI use (docs/workspace.md#tools).
# `gds workspace init` downloads each one into <workspace>/tools/<name>-<version>/, checks it against the hash below
# and refuses a mismatch. Steam or system installs are never used by the tooling: a silent update would change test
# results. Upgrading a tool is a pull request that changes this file (new version, URLs and hashes from the vendor's
# own checksum file) and passes CI.
#
# Platform keys: windows-x64, windows-arm64, linux-x64, linux-arm64, macos-x64, macos-arm64.
# `exe` is the program the tooling runs, relative to the tool's folder. `kind` picks how it is unpacked.

[tools.godot]
version = "4.7.2"
default = true
kind = "godot"
# Godot's self-contained mode (a `_sc_` file beside the program) keeps its settings and export templates in
# `editor_data/` next to it, apart from any other Godot on the machine.
checksums = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt"

[tools.godot.platforms.windows-x64]
url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip"
sha512 = "83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993"
exe = "Godot_v4.7.2-stable_win64_console.exe"

[tools.godot.platforms.linux-x64]
url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
sha512 = "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
exe = "Godot_v4.7.2-stable_linux.x86_64"

[tools.godot.platforms.linux-arm64]
url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.arm64.zip"
