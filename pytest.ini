# A bare `pytest` (or `uv run --project python pytest`) started from the checkout's root collects the kit's tests only,
# never the eval tasks' acceptance suites under evals/ (docs/studio/kit-tests.md#command). A run that names
# python/tests, as CI does, finds python/pyproject.toml first and does not read this file; keep the two in step
# (python/tests/test_root_pytest_config.py).
[pytest]
testpaths = python/tests
filterwarnings = error::pytest.PytestUnhandledThreadExceptionWarning
