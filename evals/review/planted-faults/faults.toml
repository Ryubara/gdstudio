# The planted faults of the planted-faults eval: the answer key, which only the check reads (`inputs/` is all an agent
# gets). A finding matches a fault when it names one of its files and a line within `tol` of the anchor (the first
# line of that file holding the anchor text), or the same line of `pr.diff`. A finding near no fault but on a trap is a
# false finding too; the trap only says which kind of false finding it was. A test checks that every anchor is found
# exactly once.

[[fault]]
id = "F1"
kind = "code"
summary = "a reload takes the whole gap from the reserve, which can go negative and fill rounds that are not there"
locations = [{ file = "weapon.gd", anchor = "ammo += needed", tol = 2 }]

[[fault]]
id = "F2"
kind = "code"
summary = "the reload timer counts down a fixed 0.016 per tick instead of the physics delta"
locations = [{ file = "weapon.gd", anchor = "_reload_left -= 0.016", tol = 2 }]

