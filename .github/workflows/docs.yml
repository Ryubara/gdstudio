# The kit's docs site (docs/studio/docs-site.md). It checks the rules of the topic sections, builds the site with the pinned Zensical in
# strict mode (a link to a missing page or anchor fails), writes the redirect pages of moved pages, lints the Markdown
# and the workflows, and a push to the default branch publishes the site to GitHub Pages. The build job keeps the id
# `mkdocs` because that is the name of a required check (merge.required_checks). Actions are pinned to a full commit
# SHA; the tag is in the comment beside it.
name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdocs:
    runs-on: ubuntu-24.04
    steps:
      # Two commits deep: HEAD^1 is the base the rules check compares with (the merge commit's first parent on a pull
      # request, the previous commit on main).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Every package by exact version and sha256 hash (requirements-docs.in, docs/studio/docs-site.md#pin).
      - run: pip install --require-hashes -r requirements-docs.txt
      # Rules kept in topic sections (docs/studio/rules.md#checks): no new lesson file, no page over the limit, no new
      # section without a reason line, no malformed rule, no corrections-log row that quotes the maintainer.
      - run: python .github/scripts/mistakes.py check --base HEAD^1
      - id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: zensical build --strict
      - run: python .github/scripts/site_redirects.py site
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Only this job may write to Pages, and only from the default branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mkdocs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The rules are in .markdownlint.yaml; the files skipped in .markdownlint-cli2.yaml.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #.venv
            #site

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release archive itself, checked against the release's own checksum file, with retries: GitHub's release
      # downloads answered 504 for a while on 2026-11-08 and the old download script had no retry (gdstudio #823).
      - name: Download actionlint 1.7.12
        env:
          URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL --retry 8 --retry-all-errors --retry-delay 10 -o actionlint.tar.gz "$URL"
          echo "$SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint -color .github/workflows/*.yml
