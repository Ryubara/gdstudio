# TEMPORARY (kit #229): 30 runs of the quiet-run window checks on the Windows runner, 6 fresh runners x 5 runs. Removed in
# the next commit of the branch; never merged.
name: flake-loop

on:
  push:
    branches: [tests-fix-the-quiet-run-test-counting-other]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Five runs
        shell: bash
        run: |
          fails=0
          for i in 1 2 3 4 5; do
            out=$(uv run --project python --frozen pytest python/tests/test_quiet_run.py -q -rs -p no:cacheprovider \
              -k "pointer_lock or started_programs or created_after" 2>&1) || fails=$((fails + 1))
            echo "run $i: $(echo "$out" | tail -1)"
            echo "$out" | grep -i "skip" && fails=$((fails + 1))
          done
          echo "failed or skipped runs: $fails of 5"
          test "$fails" = 0
