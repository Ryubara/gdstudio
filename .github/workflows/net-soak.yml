# 3D Third Person's online play over a long run, too long for the `template` job of ci.yml: a game made from the
# template, then its soak (the server and two predicting clients in one process over real sockets, ten game minutes at
# --fixed-fps 60: seats, settled bodies, the solid things of both worlds every 300 ticks, memory and nodes flat after
# the first minute, no ERROR in the verbose log; game/tools/net/soak.gd) with its two teeth checks, and the bytes a
# client costs for 2, 4 and 8 players through the relay against the research's budgets (game/tools/net/bandwidth.py).
# Kit docs: docs/engines/godot/third-person/online-client.md#soak-and-bandwidth. It runs nightly, by hand, and on a
# pull request that changes the soak, the bandwidth probe or this file; a failed nightly opens (or updates) one issue.
# Not a required check.
name: net-soak

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - templates/3d-third-person/game/tools/net/soak.gd
      - templates/3d-third-person/game/tools/net/bandwidth.py
      - templates/3d-third-person/game/tools/net/relay.py
      - templates/3d-third-person/game/tests/fixtures/world_parity.gd
      - .github/workflows/net-soak.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/gdstudio
          persist-credentials: false
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-soak-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot and GdUnit4
        run: uv run --project repos/gdstudio/python --frozen gds workspace init --workspace . --no-clone --no-mcp --fetch godot,gdunit4
      - name: Make a game from the template
        env:
          GIT_AUTHOR_NAME: template-check
          GIT_AUTHOR_EMAIL: template-check@example.invalid
          GIT_COMMITTER_NAME: template-check
          GIT_COMMITTER_EMAIL: template-check@example.invalid
        run: uv run --project repos/gdstudio/python --frozen gds new game template-check --template 3d-third-person --local --workspace .
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          "$godot" --headless --path repos/template-check/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: The soak (ten game minutes)
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          mkdir -p net_soak
          "$godot" --headless --verbose --path repos/template-check/game --fixed-fps 60 -s res://tools/net/soak.gd \
            2>&1 | tee net_soak/soak.log
          if grep -E "ERROR" net_soak/soak.log; then exit 1; fi
          grep "^SOAK {" net_soak/soak.log | sed 's/^SOAK /Soak: /' >> "$GITHUB_STEP_SUMMARY"
      - name: The soak's teeth (a client-only wall, a leak; each must fail)
        run: |
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          for broken in solid leak; do
            if "$godot" --headless --path repos/template-check/game --fixed-fps 60 -s res://tools/net/soak.gd \
              -- --minutes 1.5 --break "$broken" > "net_soak/teeth_$broken.log" 2>&1; then
              echo "TEETH FAILED: the soak passed with --break $broken"; exit 1
            fi
            grep "SOAK FAILED" "net_soak/teeth_$broken.log"
          done
      - name: Bandwidth for 2, 4 and 8 players
        run: |
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          python3 repos/template-check/game/tools/net/bandwidth.py --godot "$godot" \
            --project repos/template-check/game --out net_soak/bandwidth | tee net_soak/bandwidth.md
          grep "^|" net_soak/bandwidth.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: net-soak
          path: net_soak
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [soak]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="The nightly net soak failed"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "It failed again: $RUN_URL"
          else
            gh issue create --title "$title" --label task --label A-godot \
              --body "From: the net-soak workflow. The soak or the bandwidth check of 3D Third Person failed: $RUN_URL"
          fi
