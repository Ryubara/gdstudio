# The kit's build and tests on the three platforms the bootstrap supports: ruff, pytest, and a dry run of the
# bootstrap from the checkout. The `template` job makes a game from the 3D Blank template and builds it the way the
# game's own CI does. The final job, `build-ok`, is the one required check, so the jobs can change without editing the
# ruleset. Actions are pinned to a full commit SHA; the tag is in the comment beside it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --project python --frozen ruff check python
      - run: uv run --project python --frozen ruff format --check python
      - run: uv run --project python --frozen pytest python/tests -q
      # The launchers themselves, from a checkout: every step printed, nothing downloaded or created.
      - name: Bootstrap dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1 --dry-run --no-clone
      - name: Bootstrap dry run (Linux, macOS)
        if: runner.os != 'Windows'
        run: sh ./bootstrap.sh --dry-run --no-clone

  template:
    # A game made from the 3D Blank template with `gds new game`, as a person makes one, then judged by the steps of
    # the game's own ci.yml (templates/repo/.github/workflows/ci.yml): the files it must hold in sync with the kit, the
    # conventions and the layout rules, every pre-commit hook, the docs build, the import, a run, its tests and the web
    # export. It also checks that none of that left a file behind that git does not ignore: the committed uids and
    # imports are complete. About 1 GB of export templates come with the pinned Godot (cached).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/gdstudio
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-template-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot, GdUnit4 and the export templates
        run: uv run --project repos/gdstudio/python gds workspace init --workspace . --no-clone --no-mcp --fetch godot,gdunit4,godot-templates
      - name: Make a game from the template
        env:
          GIT_AUTHOR_NAME: template-check
          GIT_AUTHOR_EMAIL: template-check@example.invalid
          GIT_COMMITTER_NAME: template-check
          GIT_COMMITTER_EMAIL: template-check@example.invalid
        run: uv run --project repos/gdstudio/python gds new game template-check --template 3d-blank --workspace .
      - name: The conventions, the kit's files and the layout rules
        working-directory: repos/template-check
        run: |
          uv run --with pyyaml python .github/scripts/groundwork.py validate
          uv run --with pyyaml python .github/scripts/groundwork.py render --check
          uv run --with pyyaml python .github/scripts/groundwork.py check-files
          uv run --project ../gdstudio/python gds sync . --check
          uv run --project ../gdstudio/python gds check layout game
      - name: Every pre-commit hook of the game
        working-directory: repos/template-check
        run: uvx pre-commit@4.7.0 run --all-files
      - name: The docs build
        working-directory: repos/template-check
        run: uvx --with-requirements requirements-docs.txt mkdocs build --strict
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/template-check/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: Run the main scene
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/template-check/game --quit-after 60 2>&1 | tee run.log
          ! grep -E "^(SCRIPT )?ERROR" run.log
      - name: Run the tests (GdUnit4)
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          "$godot" --headless --path repos/template-check/game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests -rd "$RUNNER_TEMP/reports" -c --ignoreHeadlessMode --verbose 2>&1 | tee tests.log
          ! grep -E "leaked at exit|still in use" tests.log
      - name: Export the web build
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python gds tool path godot)
          mkdir -p repos/template-check/build/web
          "$godot" --headless --path repos/template-check/game --export-release Web 2>&1 | tee export.log
          if grep -E "ERROR" export.log; then exit 1; fi
          test -s repos/template-check/build/web/index.pck
          test -s repos/template-check/build/web/index.wasm
      - name: The export holds the level and leaves the tests and tools out
        run: |
          pck=repos/template-check/build/web/index.pck
          grep -aq "res://world/prototype/prototype_level.tscn" "$pck"
          ! grep -aq "res://tests/" "$pck"
          ! grep -aq "res://tools/" "$pck"
      - name: Nothing the build made is left for git to see
        working-directory: repos/template-check
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  build-ok:
    if: always()
    needs: [test, template]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
