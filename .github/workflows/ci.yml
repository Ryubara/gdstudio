# The kit's build and tests on the three platforms the bootstrap supports: ruff, pytest, and a dry run of the
# bootstrap from the checkout, the gds_ui addon's Godot tests (`godot`), and a game made from each template (a matrix
# over `3d-blank` and `3d-third-person`) and built the way the game's own CI does (`template`). The final job,
# `build-ok`, is the one required check, so the jobs can change without editing the ruleset. Actions are pinned to a
# full commit SHA; the tag is in the comment beside it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only a pull request run is cancelled by the next push; every run on `main` finishes, so each merged commit has its
# own result (the group is the commit there). A test reads this block (test_workflow_concurrency.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # The checkout sits in a GDStudio workspace (`repos/gdstudio`), so the tests find the pinned tools the way they do
    # on a person's machine (`gds tool path`).
    defaults:
      run:
        working-directory: repos/gdstudio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/gdstudio
          persist-credentials: false
          # The template holds a baked lightmap (an LFS file); without it the template job imports a pointer file.
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The windowed-Godot test of `gds quiet` (test_quiet_run.py) needs the pinned Godot, and it proves a Windows
      # rule, so Windows fetches it from tools.toml (hash-checked, cached), as the `godot` job does on Linux. The agent
      # evals' tests (test_evals.py) run each Godot task's acceptance suite against the bare template, which needs
      # GdUnit4 as well (kit #898).
      - if: runner.os == 'Windows'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-test-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot and GdUnit4 (Windows)
        if: runner.os == 'Windows'
        run: uv run --project python --frozen gds workspace init --workspace ../.. --no-clone --no-mcp --fetch godot,gdunit4
      - run: uv run --project python --frozen ruff check python
      - run: uv run --project python --frozen ruff format --check python
      # A skip that python/tests/allowed_skips.toml does not allow for this platform fails the run, and so does an
      # allowed skip whose test ran: the skip count of each runner is its count of entries (kit #797).
      # Four workers, a test file to each (the module fixtures stay one per file): the tests are processes and files,
      # not processor time, and the run took 6 min 29 s on one (kit #945).
      - run: uv run --project python --frozen pytest python/tests -q -rs -n auto --maxprocesses=4 --dist loadfile --durations=30 --allowed-skips python/tests/allowed_skips.toml
      # The launchers themselves, from a checkout: every step printed, nothing downloaded or created.
      - name: Bootstrap dry run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1 --dry-run --no-clone
      - name: Bootstrap dry run (Linux, macOS)
        if: runner.os != 'Windows'
        run: sh ./bootstrap.sh --dry-run --no-clone

  godot:
    # The gds_ui addon's own GdUnit4 suites, in the kit's Godot project (`godot/`), with the pinned Godot: the runner's
    # work folder becomes a GDStudio workspace and `gds workspace init` fetches Godot and GdUnit4 from tools.toml
    # (hash-checked, cached), as the games' CI does. Godot exits 0 on most script errors, so the import log and the
    # test log are read for them. The router's robustness suite prints `ERROR: UIRouter: ...` on purpose (the calls it
    # refuses), so the test log is judged by GdUnit4's exit code and by leaks at exit, not by every ERROR.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/gdstudio
          persist-credentials: false
          # The template holds a baked lightmap (an LFS file); without it the template job imports a pointer file.
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot and GdUnit4
        run: uv run --project repos/gdstudio/python --frozen gds workspace init --workspace . --no-clone --no-mcp --fetch godot,gdunit4
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          "$godot" --headless --path repos/gdstudio/godot --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: Run the addon's tests (GdUnit4)
        # No `-d`: with the debugger attached, the first script error stops the engine at a prompt and the job hangs.
        # `--ignoreHeadlessMode` is needed because GdUnit4 otherwise refuses to run headless.
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          "$godot" --headless --path repos/gdstudio/godot -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests -c --ignoreHeadlessMode 2>&1 | tee tests.log
          ! grep -E "SCRIPT ERROR|Parse Error|leaked at exit|still in use" tests.log
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdunit4-report
          path: |
            repos/gdstudio/godot/reports
            tests.log
            import.log

  template:
    # A game made from each template (3D Blank, 3D Third Person) with `gds new game`, as a person makes one, then judged by the steps of
    # the game's own ci.yml (templates/repo/.github/workflows/ci.yml): the files it must hold in sync with the kit, the
    # conventions and the layout rules, every pre-commit hook, the docs build, the import, a parse of every script, a
    # run, its tests, the web export and a boot of that export in a headless browser. It also checks that none of that
    # left a file behind that git does not ignore: the committed uids and imports are complete. About 1 GB of export templates come with the pinned Godot (cached).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        template: [3d-blank, 3d-third-person]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/gdstudio
          persist-credentials: false
          # The template holds a baked lightmap (an LFS file); without it the template job imports a pointer file.
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-template-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot, GdUnit4 and the export templates
        run: uv run --project repos/gdstudio/python --frozen gds workspace init --workspace . --no-clone --no-mcp --fetch godot,gdunit4,godot-templates
      - name: Make a game from the template
        env:
          GIT_AUTHOR_NAME: template-check
          GIT_AUTHOR_EMAIL: template-check@example.invalid
          GIT_COMMITTER_NAME: template-check
          GIT_COMMITTER_EMAIL: template-check@example.invalid
        run: uv run --project repos/gdstudio/python --frozen gds new game template-check --template ${{ matrix.template }} --local --workspace .
      - name: The conventions, the kit's files and the layout rules
        working-directory: repos/template-check
        run: |
          uv run --with pyyaml python .github/scripts/groundwork.py validate
          uv run --with pyyaml python .github/scripts/groundwork.py render --check
          uv run --with pyyaml python .github/scripts/groundwork.py check-files
          uv run --project ../gdstudio/python --frozen gds sync . --check
          uv run --project ../gdstudio/python --frozen gds check layout game
      - name: Every pre-commit hook of the game
        working-directory: repos/template-check
        run: uvx pre-commit@4.7.0 run --all-files
      - name: The docs build
        working-directory: repos/template-check
        run: uvx --with-requirements requirements-docs.txt mkdocs build --strict
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          "$godot" --headless --path repos/template-check/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: Every script of the game parses
        # An import and a run load only the scripts the main scene reaches; the editor and an export load them all
        # (the gds_ui demo failed to parse in every new game for want of the UIRouter autoload, kit #814).
        run: uv run --project repos/gdstudio/python --frozen gds check scripts repos/template-check/game
      - name: Run the main scene
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          "$godot" --headless --path repos/template-check/game --quit-after 60 2>&1 | tee run.log
          ! grep -E "^(SCRIPT )?ERROR" run.log
      - name: Run the tests (GdUnit4)
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          "$godot" --headless --path repos/template-check/game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests -rd ../../../reports -c --ignoreHeadlessMode --fixed-fps 60 --verbose 2>&1 | tee tests.log
          ! grep -E "leaked at exit|still in use" tests.log
      - name: Export the web build
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          mkdir -p repos/template-check/build/web
          # The at-exit leak ("N resources still in use at exit") is intermittent on CI (#954, #888) and passes on a
          # rerun of the same code. When it is the only error, export once more; a second leak, or any other error,
          # fails (docs/engines/godot/test-exit-leaks.md#the-export-leak-is-intermittent-on-ci).
          export_web() { "$godot" --headless --path repos/template-check/game --verbose --export-release Web 2>&1 | tee "$1"; }
          leak_only() { ! grep -E "ERROR" "$1" | grep -vE "still in use at exit|leaked at exit" | grep -q .; }
          export_web export.log
          if grep -qE "ERROR" export.log; then
            if leak_only export.log && grep -qE "still in use at exit|leaked at exit" export.log; then
              echo "::warning::The export ended with an at-exit leak; exporting once more. First run's leak lines:"
              grep -E "ERROR|still in use|leaked at exit|^\s+res://" export.log || true
              rm -rf repos/template-check/build/web && mkdir -p repos/template-check/build/web
              export_web export-retry.log
              if grep -E "ERROR" export-retry.log; then exit 1; fi
            else
              grep -E "ERROR" export.log; exit 1
            fi
          fi
          test -s repos/template-check/build/web/index.pck
          test -s repos/template-check/build/web/index.wasm
      - name: The export holds the level and leaves the tests and tools out
        run: |
          pck=repos/template-check/build/web/index.pck
          grep -aq "res://world/prototype/prototype_level.tscn" "$pck"
          if grep -aq -e "res://tests/" -e "res://tools/" "$pck"; then exit 1; fi
      - name: The browser for the boot check
        # Playwright's own headless Chromium, the one the local probes use (docs/engines/godot/web-probes.md).
        run: uvx playwright@1.64.1 install --with-deps chromium-headless-shell
      - name: Boot the web export in a browser
        # The export served and opened with `?probe`: it fails on a console error, a page error, a failed request or
        # no first frames within 60 s, and writes the time to them and the pack's size to the job summary
        # (game/tools/web_smoke/boot_check.py, the kit's file in every game). `gds quiet` is how every browser
        # probe runs; off Windows it starts the program as it is.
        run: |
          uv run --project repos/gdstudio/python --frozen gds quiet -- \
            uv run --with playwright==1.64.1 python repos/template-check/game/tools/web_smoke/boot_check.py \
            repos/template-check/build/web repos/template-check/build/boot --title "Web boot: ${{ matrix.template }}"
      - name: The template's own browser smoke (touch controls)
        # 3D Third Person drives its touch layer in a phone-sized page (`?probe&play`); a template without the script
        # has nothing more to add. Ratio 1 and no pictures: the runner's software renderer draws slowly.
        run: |
          smoke=repos/template-check/game/tools/web_smoke/touch_smoke.py
          if [ ! -f "$smoke" ]; then echo "no $smoke: nothing to add"; exit 0; fi
          uv run --project repos/gdstudio/python --frozen gds quiet -- \
            uv run --with playwright==1.64.1 python "$smoke" repos/template-check/build/web repos/template-check/build/smoke --ratio 1 --no-shots
          echo "Touch smoke (${{ matrix.template }}): every check passed" >> "$GITHUB_STEP_SUMMARY"
      - name: The template's web program list is current
        # 3D Third Person serves its recorded GL program list beside the page, which links it before the engine boots
        # (ShaderPrelink). A material, shader or light the list lacks is linked at its first draw, up to a second's wait
        # on a fresh GPU browser: the page plays on SwiftShader (which records the same programs as a GPU) and the step
        # fails when it links more than 10 the list lacks (kit docs/engines/godot/first-use-hitches.md#prelink-check).
        run: |
          list=repos/template-check/game/assets/shaders/web/shader_programs.json
          probe=repos/template-check/game/tools/web_smoke/shader_programs.py
          if [ ! -f "$list" ] || [ ! -f "$probe" ]; then echo "no program list: nothing to check"; exit 0; fi
          if [ ! -s repos/template-check/build/web/shader_programs.json ]; then echo "the export served no list: turn the gds_game editor plugin on"; exit 1; fi
          grep -q "gdsPrelink.load(" repos/template-check/build/web/index.html
          uv run --project repos/gdstudio/python --frozen gds quiet -- \
            uv run --with playwright==1.64.1 python "$probe" repos/template-check/build/web repos/template-check/build/programs \
            --list "$list" --max-missed 10 --quiet-s 20 --timeout-s 300
          echo "Program list (${{ matrix.template }}): current" >> "$GITHUB_STEP_SUMMARY"
      - name: The template's bad-network gate (native, and its teeth)
        # 3D Third Person's predicting client against its own server through a relay of 100 ms each way: freezes of
        # the client's thread, then 1 % of the chunks stalled 300 ms; thresholds in game/tools/net/bad_network.py
        # (kit docs/engines/godot/third-person/online-client.md#bad-network-gate). Then the same freeze run with the
        # reconciler's fix and with the server's hold taken out, each of which must fail. The browser half
        # (tools/web_smoke/net_play_smoke.py) runs on a workstation: the runner drew its page at 14 frames a second.
        run: |
          gate=repos/template-check/game/tools/net/bad_network_gate.py
          if [ ! -f "$gate" ]; then echo "no $gate: nothing to add"; exit 0; fi
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          out=repos/template-check/build/net_gate
          python3 "$gate" --godot "$godot" --project repos/template-check/game --out "$out/gate"
          python3 "$gate" --godot "$godot" --project repos/template-check/game --out "$out/teeth_reconciler" \
            --runs freeze --break reconciler --expect-fail
          python3 "$gate" --godot "$godot" --project repos/template-check/game --out "$out/teeth_hold" \
            --runs freeze --break hold --expect-fail
          echo "Bad-network gate (${{ matrix.template }}): passed, and failed with either fix taken out" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the browser captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-smoke-${{ matrix.template }}
          path: |
            repos/template-check/build/boot
            repos/template-check/build/smoke
            repos/template-check/build/net_gate
            repos/template-check/build/programs
          if-no-files-found: ignore
          retention-days: 7
      - name: Nothing the build made is left for git to see
        working-directory: repos/template-check
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  build-ok:
    if: always()
    needs: [test, godot, template]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
