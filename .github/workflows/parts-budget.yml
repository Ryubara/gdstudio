# 3D Third Person's frame budget (game/tests/gameplay/test_parts_budget.gd) run many times on unchanged code, to show it
# holds on GitHub's shared runners: a game made from the template, then the suite run ten times in each of five shards
# (fifty runs). Each run holds the budget, which must pass, and its teeth (the walkers' frame made twice as slow),
# which must fail the budget. Each run's rows (`PARTS_BUDGET`, `PARTS_BUDGET_SLOW`: the frame beside every candidate
# ruler) and the runner's processor go to one JSON line a row in the artifact. The template job of ci.yml runs the suite
# once on every pull request; this counts how often a budget on time reads the runner instead of the code. Kit docs:
# docs/engines/godot/third-person/character.md#parts-cost. It runs by hand and on a pull request that changes the
# budget, its rulers or this file. Not a required check.
name: parts-budget

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs of the budget in each of the five shards
        default: "10"
  pull_request:
    paths:
      - templates/3d-third-person/game/tests/gameplay/test_parts_budget.gd
      - .github/workflows/parts-budget.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/gdstudio
          persist-credentials: false
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cache/downloads
          key: tools-parts-budget-${{ runner.os }}-${{ hashFiles('repos/gdstudio/tools.toml') }}
      - name: Make the workspace and fetch the pinned Godot and GdUnit4
        run: uv run --project repos/gdstudio/python --frozen gds workspace init --workspace . --no-clone --no-mcp --fetch godot,gdunit4
      - name: Make a game from the template
        env:
          GIT_AUTHOR_NAME: template-check
          GIT_AUTHOR_EMAIL: template-check@example.invalid
          GIT_COMMITTER_NAME: template-check
          GIT_COMMITTER_EMAIL: template-check@example.invalid
        run: uv run --project repos/gdstudio/python --frozen gds new game template-check --template 3d-third-person --local --workspace .
      - name: Import the project
        run: |
          set -o pipefail
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          "$godot" --headless --path repos/template-check/game --import 2>&1 | tee import.log
          ! grep -E "^(SCRIPT )?ERROR" import.log
      - name: The budget, run after run
        env:
          SHARD: ${{ matrix.shard }}
          RUNS: ${{ inputs.runs || '10' }}
        run: |
          godot=$(uv run --project repos/gdstudio/python --frozen gds tool path godot)
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          echo "Shard $SHARD on $cpu ($(nproc) processors)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p gate
          failed=0
          for index in $(seq 1 "$RUNS"); do
            if ! "$godot" --headless --path repos/template-check/game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
              -a res://tests/gameplay/test_parts_budget.gd -c --ignoreHeadlessMode --fixed-fps 60 \
              > "gate/run_$index.log" 2>&1; then
              failed=$((failed + 1))
              echo "Run $index failed:" | tee -a "$GITHUB_STEP_SUMMARY"
              grep -iE "a frame|passed the frame budget|FAILED" "gate/run_$index.log" | head -8 \
                | tee -a "$GITHUB_STEP_SUMMARY" || tail -20 "gate/run_$index.log"
            fi
            for case in PARTS_BUDGET PARTS_BUDGET_SLOW; do
              grep -A3 "^$case\$" "gate/run_$index.log" | grep "^{" \
                | jq -c --arg cpu "$cpu" --arg run "$SHARD.$index" --arg case "$case" \
                  '. + {cpu: $cpu, run: $run, case: $case}' >> "gate/rows_$SHARD.jsonl" || true
            done
          done
          echo "Shard $SHARD: $failed of $RUNS runs failed" >> "$GITHUB_STEP_SUMMARY"
          exit $((failed > 0))
      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parts-budget-${{ matrix.shard }}
          path: gate/rows_*.jsonl
          if-no-files-found: ignore
          retention-days: 7
