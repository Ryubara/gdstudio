# The areas of the mistakes glossary (`gds lessons <area>`, built in memory, never committed).
# A mistake becomes a rule in the topic section it belongs to (docs/studio/rules.md), never a new file in this folder;
# the old lesson files here keep their `areas: [...]` front matter until gdstudio #770 moves them into sections. A rule
# belongs to the areas of its page ([pages], the longest matching prefix of its path under docs/), else to the areas
# its words match ([keywords]). An issue's labels map to areas ([labels]); `gds issue start` records them and the
# SubagentStart hook puts those areas' rules into the agent's context, after the sections closest to the issue's title
# (`gds learn`). [keywords] also placed the old lessons (`mistakes.py backfill`; the two best areas win).

[areas]
general = "Anything that fits no other area."
gameplay = "Rounds, zombies, weapons, the economy, power, bots and balance."
input = "Keyboard, mouse, gamepad and touch controls, pointer lock and focus."
camera = "The shoulder camera, aim and hip-fire zoom, sway, shake, field of view and interpolation."
godot-ui = "Menus, the HUD, themes, layout, UI motion and the settings screens."
net = "The network protocol, replication, prediction, lag and the game server."
web = "The browser build, the Discord Activity, export, WebGL and the web runtime."
backend = "The platform backend, Railway, Docker, lobbies and deployment."
blender = "Modelling, rigs, animation, hand grips, weapons and assets out of Blender."
audio = "Sound, voice lines, mixing and audio analysis."
godot = "Godot engine behaviour: GDScript, scenes, physics, import, shaders and performance."
tests = "Tests, bots, captures, probes and benchmarks."
ci = "GitHub Actions, checks, merging, flaky runs and the pull request queue."
tools = "The gds CLI, hooks, the workspace, pinned tools and the shared machine."
process = "Agents, coordination, issues, pull requests and documentation."

[labels]
# Issue label -> areas. `general` is always added.
A-core = ["godot", "gameplay"]
A-gameplay = ["gameplay", "input", "camera"]
A-net = ["net", "web", "backend"]
A-ui = ["godot-ui", "input"]
A-art = ["blender"]
A-world = ["gameplay", "godot"]
A-audio = ["audio"]
A-build = ["ci", "tools"]
A-agents = ["process"]
A-ci = ["ci"]
A-docs = ["process"]
A-tests = ["tests"]
A-tools = ["tools"]
A-workspace = ["tools", "process"]
A-hooks = ["tools", "process"]
A-godot = ["godot"]
A-blender = ["blender"]

[pages]
# Path prefix under docs/ -> areas. The longest prefix wins; a page with no prefix here is placed by [keywords].
"tools/blender/" = ["blender"]
"engines/godot/ui" = ["godot-ui"]
"engines/godot/web" = ["web"]
"engines/godot/multiplayer" = ["net"]
"engines/godot/audio" = ["audio"]
"engines/godot/" = ["godot"]
"gamedev/audio/" = ["audio"]
"gamedev/level-design" = ["gameplay"]
"studio/hooks" = ["tools", "process"]
"studio/workspace" = ["tools"]
"studio/capture" = ["tests"]
"studio/" = ["process"]

[keywords]
gameplay = ["zombie", "round ", "weapon", "wave", "economy", "points", "revive", "bot ", "bots", "balance", "grenade", "prize", "crane", "damage", "ammo", "power"]
input = ["input", "gamepad", "touch", "keyboard", "mouse", "pointer lock", "joystick", "controller", "focus", "cursor", "key press"]
camera = ["camera", "aim", "zoom", "sway", "shake", "fov", "interpolat", "hip fire", "hip-fire", "recoil", "sprint"]
godot-ui = [" ui ", "hud", "menu", "theme", "layout", "control node", "button", "settings screen", "label", "tab ", "panel", "scoreboard", "wardrobe"]
net = ["network", "replicat", "server", "client", "latency", "snapshot", "prediction", "desync", "packet", "lobby", "multiplayer", "lag "]
web = ["browser", "web build", "wasm", "webgl", "discord", "activity", "iframe", "export", "playwright", "chrome", "html"]
backend = ["railway", "docker", "backend", "deploy", "allocator", "oauth", "token", "postgres"]
blender = ["blender", "bone", "rig", "armature", "mesh", "animation clip", "grip", "retarget", "fbx", "gltf", "model", "texture", "mixamo"]
audio = ["audio", "sound", "voice", "elevenlabs", "reverb", "mix", "bus", "loudness", "sample"]
godot = ["gdscript", "typed", "var ", "static func", "godot", "scene", "physics", "shader", "import", "signal", "autoload", "node", "resource", "frame time", "headless", "tscn"]
tests = ["test", "gdunit", "probe", "benchmark", "capture", "assert", "flak", "smoke", "bench"]
ci = ["ci ", "workflow", "github actions", "merge", "pull request", "check run", "required check", "runner", "main is red", "cancel"]
tools = ["gds ", "hook", "workspace", "worktree", "pinned", "uv ", "pre-commit", "cli", "powershell", "windows", "git "]
process = ["agent", "coordinator", "issue", "documentation", "maintainer", "lesson", "owner"]
