# Formatting and hygiene on every commit, before CI sees it. Install once with `uvx pre-commit install`; run on
# everything with `uvx pre-commit run --all-files`. Add the language's hooks from the commented blocks below.

# Never rewritten by a hook: licence texts stay verbatim.
exclude: ^(LICENSE|CODE_OF_CONDUCT\.md)$

# gds-sync:begin install-hooks (kit-owned: edit it in the kit, then run `gds sync`)
# `pre-commit install` sets up all three: the file checks on commit, the message checks at the commit-msg stage, and
# the same message checks again on every commit about to be pushed (merges included), so nothing CI would refuse
# leaves the machine.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# gds-sync:end install-hooks

# markdownlint's Node, pinned to an LTS release: an unpinned one is whatever is newest in Node's index, pre-releases
# included, which has broken installs on Windows.
default_language_version:
  node: 24.22.2

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]              # syntax only: mkdocs.yml may use tags a safe load rejects
      - id: check-toml
      - id: check-merge-conflict
      # The same limit as paths.large_file_kb. --enforce-all checks every file given, not only newly staged ones, so
      # `run --all-files` and CI see files that are already committed.
      - id: check-added-large-files
        args: ["--maxkb=512", "--enforce-all"]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  # The rev matches the ruff that python/uv.lock pins.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^(python|\.claude/hooks)/
      - id: ruff-format
        files: ^(python|\.claude/hooks)/
  # GDScript formatting and lint for the kit's Godot project (`godot/`: the gds_ui addon and its tests) and for the
  # templates (what a new game starts with). The version is the one the games pin, so a file that passes here passes
  # unchanged in a game after `gds sync`.
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdformat
        files: ^(godot|templates)/
      - id: gdlint
        files: ^(godot|templates)/
  - repo: local
    hooks:
      # gds-sync:begin message-checks (kit-owned: edit it in the kit, then run `gds sync`)
      # The rules of .github/conventions.yml, before the commit exists: a title the squash would keep must follow
      # commits.title (tool-written titles such as `fixup!` pass), and the trailers follow commits.trailers.
      - id: commit-title
        name: commit title follows the conventions
        language: python
        additional_dependencies: [pyyaml]
        entry: python .github/scripts/groundwork.py check-title --commit-msg
        stages: [commit-msg]
      - id: commit-trailers
        name: commit trailers follow the conventions
        language: python
        additional_dependencies: [pyyaml]
        entry: python .github/scripts/groundwork.py check-message
        stages: [commit-msg]
      # The stored message of every commit that would be pushed, judged by the functions CI uses (the commit-msg hook
      # sees the message before git's cleanup, so it cannot see a `# Conflicts:` paragraph that --no-edit keeps).
      - id: push-messages
        name: pushed commits follow the conventions
        language: python
        additional_dependencies: [pyyaml]
        entry: python .github/scripts/groundwork.py check-push
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      # gds-sync:end message-checks
      # Rules kept in topic sections (docs/studio/rules.md#checks): no new lesson file, no page over the limit, no new
      # section without a reason line (against where the branch left origin/main), no malformed rule or anchor, no
      # corrections-log row that quotes the maintainer. The docs job of CI runs the same check.
      - id: mistakes-by-area
        name: rules in topic sections and the old lessons pass their checks
        language: python
        entry: python .github/scripts/mistakes.py check
        pass_filenames: false
        files: ^(docs/.*\.md|docs/lessons/areas\.toml|\.github/scripts/mistakes\.py|python/src/gds_tools/lessons\.py)$
      - id: conventions-render
        name: generated files match the conventions
        language: python
        additional_dependencies: [pyyaml]
        entry: python .github/scripts/groundwork.py render --check
        pass_filenames: false
        files: ^(\.github/|AGENTS\.md|CONTRIBUTING\.md)
